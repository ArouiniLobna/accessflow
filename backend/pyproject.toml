[project]
name = "accessflow-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lobna Arouini", email = "YOUR-ARouiniLobna-EMAIL" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.2",
]

[project.scripts]
accessflow-api = "accessflow_api:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]